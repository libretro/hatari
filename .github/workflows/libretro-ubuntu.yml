name: Build Hatari (libretro) on Ubuntu x64

on: [push, pull_request]

env:
  core_id: hatari_libretro

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: "Ubuntu x64"
          os: ubuntu-latest
          ZIP_NAME_SUFFIX: linux_x64
    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake pkg-config libsdl2-dev

    - name: Checkout Hatari (libretro) repo
      uses: actions/checkout@v7
      with:
        path: ${{ env.core_id }}
        submodules: recursive

    - name: Configure
      run: |
        cd ${{ env.core_id }}
        mkdir -p build && cd build
        cmake .. \
          -DENABLE_LIBRETRO=ON -DENABLE_HATARI=OFF -DENABLE_TOOLS=OFF -DENABLE_STATIC_ZLIB=ON -DENABLE_STATIC_CAPSIMAGE=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

    - name: Build
      run: |
        cd ${{ env.core_id }}/build
        make -j$(nproc)
